<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Majisa Jewellers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #faf7f0;
            color: #211d18;
            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: #211d18;
            color: #f4d58d;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 22px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .page {
            min-height: calc(100vh - 140px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .box {
            width: 100%;
            max-width: 470px;
            background: white;
            border: 1px solid #e1d8cb;
            padding: 42px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading small {
            color: #9b7127;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .heading h1 {
            font-size: 37px;
            margin: 9px 0 13px;
        }

        .heading p {
            color: #777;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d6ccbe;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            border-color: #9b7127;
        }

        .button {
            width: 100%;
            border: 0;
            padding: 15px;
            background: #211d18;
            color: #f4d58d;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 22px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #777;
        }

        .back a {
            color: #9b7127;
            font-weight: bold;
        }

        footer {
            background: #15120f;
            color: #ccc;
            padding: 25px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        footer a {
            color: #f4d58d;
        }

        @media (max-width: 600px) {
            nav {
                display: none;
            }

            .box {
                padding: 30px 22px;
            }

            .heading h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="/" class="brand">
        Majisa Jewellers
    </a>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Shop</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<main class="page">

    <div class="box">

        <div class="heading">

            <small>
                Account Recovery
            </small>

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter the email address associated with your
                account and we will help you recover access.
            </p>

        </div>


        <form method="POST" action="/forgot-password">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                CONTINUE
            </button>

        </form>


        <div class="back">

            Remember your password?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</main>


<footer>

    © 2026 Majisa Jewellers ·

    <a
        href="https://instagram.com/majisa_art_jewellers"
        target="_blank"
    >
        @majisa_art_jewellers
    </a>

    · 8949144970

</footer>

</body>
</html>
