<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Majisa Jewellers">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #faf7f0;
            color: #211d18;
            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            background: #211d18;
            color: #f4d58d;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 22px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .page {
            min-height: calc(100vh - 140px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            border: 1px solid #e1d8cb;
            padding: 40px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading small {
            color: #9b7127;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .heading h1 {
            font-size: 38px;
            margin-top: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6ccbe;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            border-color: #9b7127;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: 0;
            background: #211d18;
            color: #f4d58d;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 10px;
            color: #9b7127;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #999;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #e0d7ca;
            flex: 1;
        }

        .register {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #666;
        }

        .register a {
            color: #9b7127;
            font-weight: bold;
        }

        footer {
            background: #15120f;
            color: #ccc;
            padding: 25px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        footer a {
            color: #f4d58d;
        }

        @media (max-width: 600px) {
            nav {
                display: none;
            }

            .brand {
                font-size: 21px;
            }

            .login-box {
                padding: 30px 22px;
            }

            .heading h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="/" class="brand">
        Majisa Jewellers
    </a>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Shop</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<main class="page">

    <div class="login-box">

        <div class="heading">
            <small>Welcome Back</small>
            <h1>Login</h1>
        </div>


        <form method="POST" action="/login">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>


            <a
                href="/forgot-password"
                class="forgot"
            >
                Forgot Password?
            </a>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="register">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</main>


<footer>

    © 2026 Majisa Jewellers ·

    <a
        href="https://instagram.com/majisa_art_jewellers"
        target="_blank"
    >
        Instagram
    </a>

    · 8949144970

</footer>

</body>
</html>
