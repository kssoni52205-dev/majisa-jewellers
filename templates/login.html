<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Majisa Jewellers">
</head>

<body style="background:#faf7f0; font-family:Arial; padding:50px;">

    <h1>Majisa Jewellers - Login</h1>

    <form method="POST" action="/login">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
            style="display:block; width:300px; padding:12px; margin:15px 0;"
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            style="display:block; width:300px; padding:12px; margin:15px 0;"
        >

        <button
            type="submit"
            style="padding:12px 30px; cursor:pointer;"
        >
            LOGIN
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Create Account</a>
    </p>

</body>
</html>
