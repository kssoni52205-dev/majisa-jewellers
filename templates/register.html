<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Majisa Jewellers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #faf7f0;
            color: #211d18;
            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            background: #211d18;
            color: #f4d58d;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 22px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .page {
            min-height: calc(100vh - 140px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .register-box {
            width: 100%;
            max-width: 480px;
            background: white;
            border: 1px solid #e1d8cb;
            padding: 40px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading small {
            color: #9b7127;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .heading h1 {
            font-size: 38px;
            margin-top: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6ccbe;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            border-color: #9b7127;
        }

        .register-button {
            width: 100%;
            padding: 15px;
            border: 0;
            background: #211d18;
            color: #f4d58d;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .terms {
            margin-top: 15px;
            color: #777;
            font-family: Arial, sans-serif;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        .terms a {
            color: #9b7127;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #999;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #e0d7ca;
            flex: 1;
        }

        .login {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #666;
        }

        .login a {
            color: #9b7127;
            font-weight: bold;
        }

        footer {
            background: #15120f;
            color: #ccc;
            padding: 25px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        footer a {
            color: #f4d58d;
        }

        @media (max-width: 600px) {
            nav {
                display: none;
            }

            .brand {
                font-size: 21px;
            }

            .register-box {
                padding: 30px 22px;
            }

            .heading h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="/" class="brand">
        Majisa Jewellers
    </a>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Shop</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<main class="page">

    <div class="register-box">

        <div class="heading">

            <small>
                Join Majisa
            </small>

            <h1>
                Create Account
            </h1>

        </div>


        <form method="POST" action="/register">

            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="field">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                CREATE ACCOUNT
            </button>


            <div class="terms">

                By creating an account, you agree to
                our terms and privacy policy.

            </div>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</main>


<footer>

    © 2026 Majisa Jewellers ·

    <a
        href="https://instagram.com/majisa_art_jewellers"
        target="_blank"
    >
        Instagram
    </a>

    · 8949144970

</footer>

</body>
</html>
